name: Storefront 1000128740
on: [push]

permissions:
  contents: read
  deployments: write

jobs:
  deploy:
    name: Deploy to Oxygen
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          check-latest: true

      - name: Install dependencies
        run: npm ci

      - name: Build and Deploy
        # We use 'npx' to ensure we call the local CLI
        # Hydrogen v1 expects these specific env variables to trigger the upload
        run: npx shopify hydrogen build --target=worker
        env:
          SHOPIFY_HYDROGEN_DEPLOYMENT_TOKEN: ${{ secrets.OXYGEN_DEPLOYMENT_TOKEN_1000128740 }}
          SHOPIFY_SHOP_DOMAIN: ://myshopify.com
