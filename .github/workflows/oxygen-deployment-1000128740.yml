name: Storefront 1000128740
on: [push]
permissions:
  contents: read
  deployments: write
jobs:
  deploy:
    name: Deploy to Oxygen
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          check-latest: true

      - name: Install dependencies
        run: npm ci

      - name: Debug token
        run: |
          if [ -z "$TOKEN" ]; then
            echo "TOKEN IS EMPTY - secret is missing or named wrong"
          else
            echo "Token length: ${#TOKEN}"
            echo "Token starts with: ${TOKEN:0:6}..."
          fi
        env:
          TOKEN: ${{ secrets.OXYGEN_DEPLOYMENT_TOKEN_1000128740 }}

      - name: Build and deploy to Oxygen
        uses: shopify/oxygenctl-action@v4
        with:
          oxygen_deployment_token: ${{ secrets.OXYGEN_DEPLOYMENT_TOKEN_1000128740 }}
          build_command: 'npm run build'
