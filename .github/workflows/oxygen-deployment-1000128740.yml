name: Storefront 1000128740
on: [push]

permissions:
  contents: read
  deployments: write

jobs:
  deploy:
    name: Deploy to Oxygen
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18 # Required for Hydrogen v1 compatibility
          check-latest: true

      - name: Install dependencies
        run: npm ci

      - name: Build for Oxygen
        # This triggers: shopify hydrogen build --target=worker
        run: npm run build

      - name: Publish to Oxygen
        # This uses your shpat_... token to upload the build to Shopify
        run: npx shopify hydrogen deploy --token ${{ secrets.OXYGEN_DEPLOYMENT_TOKEN_1000128740 }}
