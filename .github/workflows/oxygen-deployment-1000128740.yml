name: Storefront 1000128740
on: [push]

permissions:
  contents: read
  deployments: write

jobs:
  deploy:
    name: Deploy to Oxygen
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          check-latest: true

      - name: Install dependencies
        run: npm ci

      - name: Build for Oxygen
        run: npm run build

      - name: Publish to Oxygen
        # This command is the official way to send Hydrogen v1 to Oxygen
        # It uses the shpat_ token you saved in GitHub Secrets
        run: npx shopify hydrogen build --push --target=worker --token ${{ secrets.OXYGEN_DEPLOYMENT_TOKEN_1000128740 }}
