name: Storefront 1000128740
on: [push]

permissions:
  contents: read
  deployments: write

jobs:
  deploy:
    name: Deploy to Oxygen
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          check-latest: true

      - name: Install dependencies
        run: npm ci

      - name: Build for Oxygen
        # This creates the dist/worker/index.js file
        run: npm run build

      - name: Manual Upload to Oxygen
        env:
          OXYGEN_TOKEN: ${{ secrets.OXYGEN_DEPLOYMENT_TOKEN_1000128740 }}
        run: |
          # 1. Zip the worker contents so index.js is at the root
          cd dist/worker && zip -r ../worker.zip . && cd ../..

          # 2. Upload to the Oxygen Deployment Receiver
          # We've added the deployment_token and a version tag to force dashboard recognition
          curl -X POST "https://shopifycloud.com" \
          -H "Authorization: Bearer $OXYGEN_TOKEN" \
          -F "file=@dist/worker.zip" \
          -F "metadata={\"runtime\":\"worker\",\"branch\":\"main\",\"environment\":\"production\",\"deployment_token\":\"$OXYGEN_TOKEN\",\"version\":\"1.0.${{ github.run_number }}\"}"
