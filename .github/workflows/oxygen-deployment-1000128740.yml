name: Storefront 1000128740
on: [push]

permissions:
  contents: read
  deployments: write

jobs:
  deploy:
    name: Deploy to Oxygen
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          check-latest: true

      - name: Install dependencies
        run: npm ci

      - name: Build for Oxygen
        run: npm run build

      - name: Manual Upload to Oxygen
        env:
          OXYGEN_TOKEN: ${{ secrets.OXYGEN_DEPLOYMENT_TOKEN_1000128740 }}
        run: |
          # 1. Prepare a clean deployment folder
          mkdir -p deploy
          cp -r dist/worker/* deploy/
          cp -r dist/client/* deploy/

          # 2. Create the zip from the root of that folder
          cd deploy && zip -r ../deploy.zip . && cd ..

          # 3. Upload to the ACTUAL Oxygen API Receiver
          # This endpoint is specifically for Oxygen deployments
          curl -X POST "https://shopifycloud.com" \
          -H "Authorization: Bearer $OXYGEN_TOKEN" \
          -F "file=@deploy.zip" \
          -F "metadata={\"runtime\":\"worker\",\"branch\":\"main\",\"environment\":\"production\"}"
