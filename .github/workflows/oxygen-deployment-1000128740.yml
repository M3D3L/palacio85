name: Storefront 1000128740
on: [push]

permissions:
  contents: read
  deployments: write

jobs:
  deploy:
    name: Deploy to Oxygen
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          check-latest: true

      - name: Install dependencies
        run: npm ci

      - name: Build for Oxygen
        run: npm run build

      - name: Manual Upload to Oxygen
        env:
          OXYGEN_TOKEN: ${{ secrets.OXYGEN_DEPLOYMENT_TOKEN_1000128740 }}
        run: |
          # 1. Empaquetar el worker
          cd dist/worker && zip -r ../worker.zip . && cd ../..

          # 2. Subir con metadatos completos para sincronizar con el panel de Shopify
          curl -X POST "https://shopifycloud.com" \
          -H "Authorization: Bearer $OXYGEN_TOKEN" \
          -F "file=@dist/worker.zip" \
          -F "metadata={\"runtime\":\"worker\",\"branch\":\"main\",\"environment\":\"production\",\"deployment_token\":\"$OXYGEN_TOKEN\",\"commit_sha\":\"${{ github.sha }}\",\"commit_message\":\"${{ github.event.head_commit.message }}\",\"commit_author\":\"${{ github.actor }}\"}"
